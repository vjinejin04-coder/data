<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberNews MN — Threat Intelligence төв</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
      color:#e2e8f0;
      min-height:100vh;
    }

    /* Header */
    .header{
      position:sticky;top:0;z-index:1000;
      background:rgba(15,23,42,.95);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(148,163,184,.12);
    }
    .header-content{
      max-width:1400px;margin:auto;padding:1.2rem 2rem;
      display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
    }
    .logo{display:flex;align-items:center;gap:1rem}
    .logo-icon{
      width:40px;height:40px;border-radius:10px;
      background:linear-gradient(135deg,#ef4444,#f97316);
      display:flex;align-items:center;justify-content:center;font-size:1.4rem;
    }
    .logo-text h1{
      font-size:1.25rem;font-weight:900;
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .logo-text p{font-size:.85rem;color:#94a3b8}

    .nav{display:flex;gap:.5rem;flex-wrap:wrap}
    .nav a{
      text-decoration:none;color:#cbd5e1;
      padding:.5rem .9rem;border-radius:10px;
      border:1px solid rgba(148,163,184,.15);
      background:rgba(15,23,42,.45);
      font-size:.9rem;
    }
    .nav a.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;border:none;
    }

    .btn{
      padding:.55rem 1rem;border-radius:10px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(15,23,42,.45);
      color:#e2e8f0;cursor:pointer;font-weight:700;
    }
    .btn-primary{
      border:none;
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;
    }

    /* Layout */
    .container{max-width:1400px;margin:auto;padding:2.2rem 2rem}

    .hero{
      background:rgba(30,41,59,.55);
      border:1px solid rgba(148,163,184,.12);
      border-radius:18px;
      padding:1.5rem;
      margin-bottom:1.25rem;
    }
    .hero h2{font-size:1.6rem;margin-bottom:.4rem}
    .hero p{color:#cbd5e1;line-height:1.6}

    .kpis{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:.75rem;
      margin-top:1rem;
    }
    .kpi{
      background:rgba(15,23,42,.55);
      border:1px solid rgba(148,163,184,.12);
      border-radius:14px;
      padding:.9rem;
    }
    .kpi .label{font-size:.8rem;color:#94a3b8}
    .kpi .value{font-size:1.3rem;font-weight:900}

    /* Search */
    .search{
      background:rgba(30,41,59,.55);
      border:1px solid rgba(148,163,184,.12);
      border-radius:18px;
      padding:1.4rem;
      margin:1.2rem 0;
    }
    .search-row{display:flex;gap:.75rem;flex-wrap:wrap}
    .search input{
      flex:1;min-width:260px;
      padding:.9rem 1.1rem;
      background:rgba(15,23,42,.8);
      border:1px solid rgba(148,163,184,.22);
      border-radius:14px;
      color:#e2e8f0;
    }

    .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
    .chip{
      padding:.4rem .85rem;border-radius:999px;
      border:1px solid rgba(148,163,184,.2);
      background:rgba(15,23,42,.55);
      cursor:pointer;font-size:.85rem;
    }
    .chip.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      border:none;color:#fff;
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:1rem;
    }
    .card{
      background:rgba(30,41,59,.55);
      border:1px solid rgba(148,163,184,.12);
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
    }
    .card:hover{border-color:rgba(239,68,68,.4)}

    .card-top{
      padding:.8rem 1rem;
      background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(249,115,22,.18));
      display:flex;gap:.4rem;flex-wrap:wrap;
    }
    .tag{
      font-size:.72rem;
      padding:.25rem .6rem;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.25);
      background:rgba(15,23,42,.45);
    }
    .tag.red{color:#fecaca;border-color:rgba(239,68,68,.4)}
    .tag.orange{color:#fdba74;border-color:rgba(249,115,22,.4)}
    .tag.blue{color:#bfdbfe;border-color:rgba(59,130,246,.4)}

    .card-body{padding:1rem}
    .card-title{font-size:1.05rem;font-weight:900;margin-bottom:.3rem}
    .card-desc{font-size:.9rem;color:#cbd5e1;line-height:1.5}
    .meta{
      margin-top:.7rem;
      font-size:.82rem;
      color:#94a3b8;
      display:flex;justify-content:space-between;
    }

    /* Drawer */
    .drawer{
      position:fixed;inset:0;
      background:rgba(0,0,0,.82);
      display:none;z-index:3000;
      justify-content:center;align-items:flex-start;
      padding:2rem 1rem;
    }
    .drawer.active{display:flex}
    .drawer-inner{
      background:rgba(30,41,59,.95);
      border:1px solid rgba(148,163,184,.2);
      border-radius:18px;
      max-width:1000px;width:100%;
      padding:1.6rem;
      position:relative;
    }
    .close{
      position:absolute;top:1rem;right:1rem;
      width:40px;height:40px;border-radius:50%;
      border:none;background:rgba(239,68,68,.25);
      color:#fff;font-size:1.4rem;cursor:pointer;
    }
    .block{
      background:rgba(15,23,42,.55);
      border:1px solid rgba(148,163,184,.12);
      border-radius:14px;
      padding:1.1rem;
      margin-top:1rem;
    }
    .block h3{margin-bottom:.6rem;color:#f87171}
    .mono{
      font-family:monospace;
      background:#020617;
      padding:.8rem;
      border-radius:10px;
      white-space:pre-wrap;
    }

    @media(max-width:768px){
      .container{padding:1.5rem 1rem}
      .kpis{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>

<body>
<header class="header">
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">🎯</div>
      <div class="logo-text">
        <h1>CyberNews MN</h1>
        <p>Threat Intelligence төв</p>
      </div>
    </div>

    <nav class="nav">
      <a href="./index.html">📰 Мэдээ</a>
      <a href="./cve.html">🔓 CVE төв</a>
      <a href="./threat.html" class="active">🎯 Threat төв</a>
    </nav>

    <div>
      <button class="btn" onclick="exportCSV()">⬇️ Export</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h2>Threat Intelligence төв</h2>
    <p>
      APT бүлэг, malware, идэвхтэй халдлагын кампанит ажлуудыг нэг дороос
      хянаж, SOC / CERT түвшинд шууд ашиглах боломжтой.
    </p>

    <div class="kpis">
      <div class="kpi"><div class="label">Нийт Threat</div><div class="value" id="kTotal">0</div></div>
      <div class="kpi"><div class="label">Active</div><div class="value" id="kActive">0</div></div>
      <div class="kpi"><div class="label">APT</div><div class="value" id="kAPT">0</div></div>
      <div class="kpi"><div class="label">Malware</div><div class="value" id="kMalware">0</div></div>
    </div>
  </div>

  <div class="search">
    <div class="search-row">
      <input id="q" placeholder="APT / Malware / IOC / тайлбар хайх…">
      <button class="btn-primary btn" onclick="render()">Хайх</button>
    </div>

    <div class="chips">
      <div class="chip active" onclick="setFilter('all')">🔥 All</div>
      <div class="chip" onclick="setFilter('apt')">🎭 APT</div>
      <div class="chip" onclick="setFilter('malware')">🦠 Malware</div>
      <div class="chip" onclick="setFilter('campaign')">⚔️ Campaign</div>
      <div class="chip" onclick="setFilter('active')">🚨 Active</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-inner">
    <button class="close" onclick="closeDrawer()">×</button>
    <div id="drawerBody"></div>
  </div>
</div>

<script>
const threats = [
  {
    id:"APT29",
    type:"apt",
    active:true,
    severity:"high",
    title:"APT29 (Cozy Bear)",
    desc:"Засгийн газар, дипломат салбарыг онилсон phishing ба backdoor халдлагууд.",
    iocs:["185.86.151.11","cozy-update[.]com","d41d8cd98f00b204e9800998ecf8427e"],
    mitigations:["MFA","Email gateway rules","EDR IOC scan"]
  },
  {
    id:"Emotet",
    type:"malware",
    active:false,
    severity:"medium",
    title:"Emotet Malware",
    desc:"Email-based malware loader, botnet infrastructure.",
    iocs:["91.92.240.12","invoice-doc[.]net"],
    mitigations:["Block macros","Email filtering","Network IOC blocking"]
  },
  {
    id:"Volt Typhoon",
    type:"campaign",
    active:true,
    severity:"critical",
    title:"Volt Typhoon Campaign",
    desc:"Critical infrastructure targeting, living-off-the-land techniques.",
    iocs:["vpn-update[.]org","103.27.203.44"],
    mitigations:["Log review","Admin credential rotation","Network segmentation"]
  }
];

let filter="all";

function setFilter(f){
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render(){
  const q=(document.getElementById('q').value||"").toLowerCase();
  let list=[...threats];

  if(filter==="apt") list=list.filter(x=>x.type==="apt");
  if(filter==="malware") list=list.filter(x=>x.type==="malware");
  if(filter==="campaign") list=list.filter(x=>x.type==="campaign");
  if(filter==="active") list=list.filter(x=>x.active);

  list=list.filter(x=>
    x.title.toLowerCase().includes(q) ||
    x.desc.toLowerCase().includes(q) ||
    x.iocs.join(" ").toLowerCase().includes(q)
  );

  document.getElementById('kTotal').textContent=threats.length;
  document.getElementById('kActive').textContent=threats.filter(x=>x.active).length;
  document.getElementById('kAPT').textContent=threats.filter(x=>x.type==="apt").length;
  document.getElementById('kMalware').textContent=threats.filter(x=>x.type==="malware").length;

  const grid=document.getElementById('grid');
  grid.innerHTML=list.map(t=>`
    <div class="card" onclick="openThreat('${t.id}')">
      <div class="card-top">
        <span class="tag ${t.severity==='critical'?'red':'orange'}">${t.severity.toUpperCase()}</span>
        <span class="tag blue">${t.type.toUpperCase()}</span>
        ${t.active?'<span class="tag red">ACTIVE</span>':''}
      </div>
      <div class="card-body">
        <div class="card-title">${t.title}</div>
        <div class="card-desc">${t.desc}</div>
        <div class="meta">
          <span>IOC: ${t.iocs.length}</span>
          <span>${t.active?'🚨 Идэвхтэй':'— Archived'}</span>
        </div>
      </div>
    </div>
  `).join("") || "<p style='color:#94a3b8'>Threat олдсонгүй</p>";
}

function openThreat(id){
  const t=threats.find(x=>x.id===id);
  document.getElementById('drawerBody').innerHTML=`
    <h2>${t.title}</h2>
    <p style="color:#cbd5e1">${t.desc}</p>

    <div class="block">
      <h3>📌 Indicators of Compromise</h3>
      <div class="mono">${t.iocs.join("\n")}</div>
    </div>

    <div class="block">
      <h3>🛡️ Mitigations</h3>
      <ul>${t.mitigations.map(m=>`<li>${m}</li>`).join("")}</ul>
    </div>
  `;
  document.getElementById('drawer').classList.add('active');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('active');
}

function exportCSV(){
  const rows=threats.map(t=>`${t.id},${t.type},${t.severity},${t.active}`);
  const csv="id,type,severity,active\n"+rows.join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="threat_export.csv";
  a.click();
}

render();
</script>
</body>
</html>
